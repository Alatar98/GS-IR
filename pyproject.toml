[project]
name = "pgsr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "diff-gaussian-rasterization",
    "opencv-python>=4.13.0.92",
    "plyfile>=1.1.3",
    "scikit-image==0.21.0",
    "simple-knn",
    "torch==2.11.0+cu129",
    "torchaudio==2.11.0",
    "torchvision==0.26.0+cu129",
    "trimesh==4.3.2",
    "typing-extensions>=4.15.0",
    "lpips==0.1.4",
    "open3d>=0.19.0",
    "tqdm>=4.65.0",
    "kornia",
    "nvdiffrast",
]

[tool.uv.sources]
diff-gaussian-rasterization = { workspace = true }
simple-knn = { workspace = true }
nvdiffrast = { workspace = true }


[tool.uv]
no-build-isolation-package = [
    "diff-gaussian-rasterization",
    "simple-knn",
    "nvdiffrast",
]
find-links = ["https://mirrors.aliyun.com/pytorch-wheels/cu129/"]


[[tool.uv.index]]
name = "pypi"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
default = true

[tool.uv.workspace]
members = [
    "submodules/diff-gaussian-rasterization",
    "submodules/simple-knn",
    "submodules/nvdiffrast",
]

[tool.black]
line-length = 100

[tool.isort]
line_length = 100
profile = "black"
